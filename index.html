<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raghav Kohli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; overflow-x: hidden; }

:root {
  --black:   #201f20;
  --white:   #ffffff;
  --gt:      #a0a0a0;   /* grey text */
  --gb:      #e6e6e6;   /* grey border */
  --gbg:     #f0f0f0;   /* grey background */
  --cyan:    #00aeef;
  --magenta: #ec008c;
  --ff:  Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;
  --ffd: 'Space Grotesk', "Helvetica Neue", Helvetica, Arial, sans-serif;
  --tr: 0.3s;
}

body {
  background: var(--white);
  color: var(--black);
  font-family: var(--ff);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* ═══════════════════════════════════════
   HERO
═══════════════════════════════════════ */
.site-hero {
  position: relative;
  height: 70vh;
  min-height: 520px;
  overflow: hidden;
  background: var(--black);
  /* hero sits under the sticky header — negative margin pulls it up */
  margin-top: -80px;
}

/* Cycling slide layers */
.hero-slide {
  position: absolute; inset: 0;
  background: center / cover no-repeat;
  opacity: 0;
  transition: opacity 1.4s ease;
  will-change: opacity;
}
.hero-slide.active { opacity: 1; }

/* Gradient scrim: dark at top (for header legibility) + subtle bottom */
.hero-scrim {
  position: absolute; inset: 0;
  background: linear-gradient(
    180deg,
    rgba(32,31,32,0.55) 0%,
    rgba(32,31,32,0.1)  28%,
    rgba(32,31,32,0.05) 60%,
    rgba(32,31,32,0.35) 100%
  );
  pointer-events: none;
}

/* Slide counter dots */
.hero-dots {
  position: absolute;
  bottom: 20px; left: 50%;
  transform: translateX(-50%);
  display: flex; gap: 6px;
  z-index: 5;
}
.hero-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: rgba(255,255,255,0.35);
  cursor: pointer;
  transition: background var(--tr);
  border: none;
  padding: 0;
}
.hero-dot.active { background: rgba(255,255,255,0.9); }

/* ═══════════════════════════════════════
   HEADER (sticky, transparent over hero)
═══════════════════════════════════════ */
.site-header {
  position: sticky;
  top: 0;
  z-index: 100;
  height: 80px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 6.25vw;
  background: transparent;
  border-bottom: 1px solid transparent;
  transition: background var(--tr), border-color var(--tr);
}
/* After hero: solid white */
.site-header.scrolled {
  background: var(--white);
  border-bottom-color: var(--gb);
}

/* Name — Space Grotesk, compact wordmark */
.site-wordmark {
  font-family: var(--ffd);
  font-size: 22px;
  font-weight: 700;
  line-height: 0.88;
  letter-spacing: -0.3px;
  color: var(--white);
  text-transform: uppercase;
  transition: color var(--tr);
}
.site-wordmark span { display: block; }
.site-header.scrolled .site-wordmark { color: var(--black); }

/* Controls group */
.header-right {
  display: flex;
  align-items: center;
  gap: 20px;
}

/* Search */
.search-wrap { position: relative; }
.search-input {
  width: 200px; height: 38px;
  border: none;
  border-bottom: 1px solid rgba(255,255,255,0.5);
  background: transparent;
  padding: 0 26px 0 0;
  font: 500 13px/1.3 var(--ff);
  color: var(--white);
  outline: none;
  transition: border-color var(--tr), color var(--tr);
  border-radius: 0;
  -webkit-appearance: none;
}
.search-input:focus { border-bottom-color: var(--white); }
.search-input::placeholder { color: rgba(255,255,255,0.55); }
.search-icon {
  position: absolute; right: 0; top: 50%;
  transform: translateY(-50%);
  color: rgba(255,255,255,0.55); font-size: 15px;
  pointer-events: none;
  transition: color var(--tr);
}
/* Solid state */
.site-header.scrolled .search-input {
  border-bottom-color: var(--gb);
  color: var(--black);
}
.site-header.scrolled .search-input:focus { border-bottom-color: var(--cyan); }
.site-header.scrolled .search-input::placeholder { color: var(--gt); }
.site-header.scrolled .search-icon { color: var(--gt); }

/* Filter chips */
.filter-chips { display: flex; gap: 4px; }
.chip {
  font: 700 12px/1 var(--ff);
  letter-spacing: 0.03em;
  padding: 7px 13px;
  border: 1px solid rgba(255,255,255,0.5);
  color: rgba(255,255,255,0.85);
  cursor: pointer; background: none; border-radius: 0;
  transition: all var(--tr);
}
.chip:hover { border-color: var(--white); color: var(--white); }
.chip.active { background: var(--magenta); color: var(--white); border-color: var(--magenta); }
/* Solid state */
.site-header.scrolled .chip {
  border-color: var(--gb);
  color: var(--gt);
}
.site-header.scrolled .chip:hover { border-color: var(--cyan); color: var(--cyan); }
.site-header.scrolled .chip.active { background: var(--magenta); color: var(--white); border-color: var(--magenta); }

.header-count {
  font: 500 12px/1 var(--ff);
  color: rgba(255,255,255,0.55);
  white-space: nowrap;
  transition: color var(--tr);
}
.site-header.scrolled .header-count { color: var(--gt); }

/* ═══════════════════════════════════════
   PAGE BODY: RAIL + GRID
═══════════════════════════════════════ */
.page-body {
  display: flex;
  align-items: flex-start;
  border-top: 1px solid var(--gb);
}

/* ── Work Rail ── */
.work-rail {
  width: 200px;
  flex-shrink: 0;
  position: sticky;
  top: 80px;
  height: calc(100vh - 80px);
  overflow-y: auto;
  border-right: 1px solid var(--gb);
  padding: 24px 0 40px;
  display: flex;
  flex-direction: column;
}
.work-rail::-webkit-scrollbar { width: 0; }

.rail-label {
  font: 700 10px/1 var(--ff);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--gt);
  padding: 0 20px 12px;
  border-bottom: 1px solid var(--gb);
  margin-bottom: 2px;
}

.work-entry {
  padding: 12px 20px;
  border-bottom: 1px solid var(--gb);
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: border-left-color var(--tr);
}
.work-entry:last-child { border-bottom: none; }
.work-entry:hover .work-org { color: var(--cyan); }
.work-entry:hover .work-role { color: var(--cyan); }
.work-entry.active { border-left-color: var(--magenta); }
.work-entry.active .work-org { color: var(--magenta); }

.work-org {
  font: 600 12px/1.3 var(--ff);
  color: var(--black);
  margin-bottom: 3px;
  transition: color var(--tr);
}
.work-role {
  font: 400 11px/1.4 var(--ff);
  color: var(--gt);
  transition: color var(--tr);
}
.work-period {
  font: 400 10px/1 var(--ff);
  letter-spacing: 0.02em;
  color: var(--gb);
  margin-top: 4px;
}
.work-entry.active .work-period { color: rgba(236,0,140,0.35); }

/* ── Project area ── */
.project-area { flex: 1; min-width: 0; }

/* ═══════════════════════════════════════
   GRID
═══════════════════════════════════════ */
.project-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--gb);
}

/* ═══════════════════════════════════════
   MODULE (CARD)
═══════════════════════════════════════ */
.module {
  background: var(--white);
  cursor: pointer;
  display: flex;
  flex-direction: column;
}
.module.hidden { display: none; }

/* Square image head */
.module-head {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  flex-shrink: 0;
}
.module-head-inner {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: #2a2828;
}
.module-head-inner img {
  width: 100%; height: 100%;
  object-fit: cover; display: block;
  transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
.module:hover .module-head-inner img { transform: scale(1.04); }

/* 3px bar slides up from bottom */
.module-head-inner::after {
  content: '';
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 3px; background: var(--cyan);
  transform: translateY(3px);
  transition: transform var(--tr);
  z-index: 2;
}
.module:hover .module-head-inner::after { transform: translateY(0); }
.module.active .module-head-inner::after { background: var(--magenta); transform: translateY(0); }

/* Triangle notch below image */
.module-head::after {
  content: '';
  position: absolute; bottom: -9px; left: 50%;
  transform: translateX(-50%);
  border-left: 9px solid transparent;
  border-right: 9px solid transparent;
  border-top: 9px solid var(--gb);
  transition: border-top-color var(--tr);
  z-index: 3;
}
.module:hover .module-head::after  { border-top-color: var(--cyan); }
.module.active .module-head::after { border-top-color: var(--magenta); }

/* Empty head placeholder */
.module-head-empty .module-head-inner {
  background: var(--gbg);
}
.module-head-empty .module-head-inner::before {
  content: '';
  position: absolute; inset: 0;
  background: repeating-linear-gradient(
    -45deg,
    transparent,
    transparent 18px,
    rgba(0,0,0,0.03) 18px,
    rgba(0,0,0,0.03) 19px
  );
}

/* Body */
.module-body { padding: 22px 28px 28px; flex: 1; display: flex; flex-direction: column; }
.module-no-head .module-body { padding-top: 28px; }

.module-eyebrow {
  font: 700 12px/1.3 var(--ff);
  text-transform: uppercase; letter-spacing: 0.07em;
  color: var(--gt); margin-bottom: 8px;
  transition: color var(--tr);
}
.module-title {
  font: 700 18px/1.2 var(--ffd);
  color: var(--black); margin-bottom: 10px;
  transition: color var(--tr);
}
.module-excerpt {
  font: 400 13px/1.75 var(--ff);
  color: var(--gt); flex: 1; margin-bottom: 12px;
  display: -webkit-box; -webkit-line-clamp: 3;
  -webkit-box-orient: vertical; overflow: hidden;
  transition: color var(--tr);
}
.module-meta {
  font: 400 12px/1.3 var(--ff);
  color: var(--gt); margin-bottom: 7px;
  transition: color var(--tr);
}
.module-tags { display: flex; flex-wrap: wrap; gap: 0 5px; }
.module-tag {
  font: 400 12px/1.6 var(--ff); color: var(--gt);
  transition: color var(--tr);
}
.module-tag::before { content: '#'; }

/* Hover → all text cyan */
.module:hover .module-eyebrow,
.module:hover .module-title,
.module:hover .module-excerpt,
.module:hover .module-meta,
.module:hover .module-tag { color: var(--cyan); }

/* Active → title magenta */
.module.active .module-title { color: var(--magenta); }

/* Empty state */
.grid-empty {
  grid-column: 1 / -1; padding: 80px 40px;
  font: 700 12px/1 var(--ff); letter-spacing: 0.07em;
  text-transform: uppercase; color: var(--gt);
  text-align: center; background: var(--white);
}

/* ═══════════════════════════════════════
   DETAIL PANEL
═══════════════════════════════════════ */
.detail-overlay {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(32,31,32,0.4);
}
.detail-overlay.open { display: block; }

.detail-panel {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: min(820px, 90vw); background: var(--white);
  z-index: 201; display: flex; flex-direction: column;
  overflow: hidden;
  transform: translateX(100%);
  transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: -8px 0 48px rgba(32,31,32,0.12);
}
.detail-overlay.open .detail-panel { transform: translateX(0); }

.detail-header {
  padding: 26px 32px 20px; border-bottom: 1px solid var(--gb);
  display: flex; justify-content: space-between; align-items: flex-start;
  flex-shrink: 0; gap: 20px;
}
.detail-org {
  font: 700 11px/1.3 var(--ff); letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--gt); margin-bottom: 6px;
}
.detail-title { font: 700 24px/1.1 var(--ffd); color: var(--black); }
.detail-close {
  font: 700 11px/1 var(--ff); letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--gt);
  background: none; border: none; cursor: pointer;
  flex-shrink: 0; padding-top: 4px; transition: color var(--tr);
}
.detail-close:hover { color: var(--cyan); }

.detail-body { flex: 1; overflow-y: auto; }
.detail-desc {
  padding: 22px 32px; font: 400 14px/1.9 var(--ff);
  color: var(--gt); border-bottom: 1px solid var(--gb);
}
.detail-tags {
  padding: 12px 32px; display: flex; flex-wrap: wrap; gap: 6px;
  border-bottom: 1px solid var(--gb);
}
.detail-tag { font: 400 12px/1.5 var(--ff); color: var(--gt); }
.detail-tag::before { content: '#'; }

.detail-subprojects { padding: 18px 32px; border-bottom: 1px solid var(--gb); }
.detail-sub-label {
  font: 700 11px/1 var(--ff); letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--gt); margin-bottom: 12px;
}
.sub-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 0; border-bottom: 1px solid var(--gb); cursor: pointer;
}
.sub-row:last-child { border-bottom: none; }
.sub-row-title { font: 500 13px/1.3 var(--ff); color: var(--black); transition: color var(--tr); }
.sub-row:hover .sub-row-title { color: var(--cyan); }
.sub-row-meta { display: flex; gap: 10px; align-items: center; }
.sub-row-count { font: 400 12px/1 var(--ff); color: var(--gt); }
.sub-row-arr { color: var(--gt); font-size: 13px; transition: color var(--tr); }
.sub-row:hover .sub-row-arr { color: var(--cyan); }

.detail-images { padding: 22px 32px 32px; }
.detail-images-label {
  font: 700 11px/1 var(--ff); letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--gt); margin-bottom: 12px;
}
.img-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.img-thumb { aspect-ratio: 4/3; overflow: hidden; cursor: pointer; background: var(--gbg); }
.img-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.35s; display: block; }
.img-thumb:hover img { transform: scale(1.05); }

/* ═══════════════════════════════════════
   READER
═══════════════════════════════════════ */
.reader-wrap { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.reader-stage {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 24px 52px; position: relative; background: var(--gbg);
  cursor: zoom-in; min-height: 0; overflow: hidden;
}
.reader-img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; box-shadow: 0 8px 40px rgba(32,31,32,0.1); }
.reader-nav {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 16px; color: var(--gt);
  background: var(--white); border: 1px solid var(--gb); border-radius: 0;
  transition: all var(--tr); z-index: 2;
}
.reader-nav:hover { border-color: var(--cyan); color: var(--cyan); }
.reader-prev { left: 8px; } .reader-next { right: 8px; }
.reader-bar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 14px; border-top: 1px solid var(--gb); flex-shrink: 0;
}
.reader-count { font: 400 11px/1 var(--ff); letter-spacing: 0.05em; color: var(--gt); }
.reader-back {
  font: 700 11px/1 var(--ff); letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--gt); background: none; border: none; cursor: pointer; transition: color var(--tr);
}
.reader-back:hover { color: var(--cyan); }
.reader-strip {
  padding: 6px 10px; display: flex; gap: 3px;
  overflow-x: auto; border-top: 1px solid var(--gb); flex-shrink: 0;
}
.reader-strip::-webkit-scrollbar { height: 2px; }
.reader-strip::-webkit-scrollbar-thumb { background: var(--gb); }
.reader-thumb {
  flex-shrink: 0; width: 46px; height: 32px; overflow: hidden;
  cursor: pointer; opacity: 0.3; transition: opacity var(--tr);
}
.reader-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.reader-thumb:hover { opacity: 0.65; }
.reader-thumb.active { opacity: 1; outline: 2px solid var(--cyan); outline-offset: 1px; }

/* ═══════════════════════════════════════
   PERSPECTIVES
═══════════════════════════════════════ */
.persp-stats { display: flex; border-bottom: 1px solid var(--gb); }
.persp-stat { flex: 1; padding: 22px 26px; border-right: 1px solid var(--gb); }
.persp-stat:last-child { border-right: none; }
.persp-stat-n { font: 700 36px/1 var(--ffd); color: var(--black); margin-bottom: 6px; }
.persp-stat-l { font: 700 11px/1 var(--ff); letter-spacing: 0.08em; text-transform: uppercase; color: var(--gt); }
.persp-convs { padding: 18px 32px 32px; }
.persp-convs-label { font: 700 11px/1 var(--ff); letter-spacing: 0.08em; text-transform: uppercase; color: var(--gt); margin-bottom: 14px; }
.conv-row { display: flex; gap: 14px; align-items: baseline; padding: 13px 0; border-bottom: 1px solid var(--gb); }
.conv-row:last-child { border-bottom: none; }
.conv-format { font: 700 10px/1 var(--ff); letter-spacing: 0.07em; text-transform: uppercase; color: var(--magenta); flex-shrink: 0; min-width: 54px; }
.conv-info { flex: 1; }
.conv-name { font: 500 13px/1.3 var(--ff); color: var(--black); margin-bottom: 3px; }
.conv-desc-s { font: 400 11px/1.6 var(--ff); color: var(--gt); }
.conv-date { font: 400 11px/1 var(--ff); color: var(--gt); white-space: nowrap; }

/* ═══════════════════════════════════════
   LIGHTBOX
═══════════════════════════════════════ */
.lightbox { display: none; position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,0.97); flex-direction: column; }
.lightbox.open { display: flex; }
.lb-top { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; flex-shrink: 0; }
.lb-label { font: 500 11px/1 var(--ff); letter-spacing: 0.07em; text-transform: uppercase; color: rgba(255,255,255,0.3); }
.lb-close { font: 700 11px/1 var(--ff); letter-spacing: 0.07em; text-transform: uppercase; color: rgba(255,255,255,0.35); background: none; border: none; cursor: pointer; transition: color var(--tr); }
.lb-close:hover { color: #fff; }
.lb-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 64px; position: relative; min-height: 0; }
.lb-main img { max-height: 100%; max-width: 100%; object-fit: contain; }
.lb-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: none; border: none; color: rgba(255,255,255,0.3); font-size: 38px; cursor: pointer; padding: 16px; transition: color var(--tr); line-height: 1; }
.lb-arrow:hover { color: #fff; }
.lb-prev { left: 0; } .lb-next { right: 0; }
.lb-counter { font: 400 11px/1 var(--ff); color: rgba(255,255,255,0.2); text-align: center; padding: 8px; flex-shrink: 0; }
.lb-strip { padding: 6px 40px 20px; display: flex; gap: 5px; overflow-x: auto; justify-content: center; flex-shrink: 0; }
.lb-strip::-webkit-scrollbar { height: 2px; }
.lb-strip::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); }
.lb-thumb { width: 52px; height: 38px; object-fit: cover; cursor: pointer; opacity: 0.28; transition: opacity var(--tr); flex-shrink: 0; }
.lb-thumb.active { opacity: 1; outline: 1px solid rgba(255,255,255,0.5); }
.lb-thumb:hover { opacity: 0.65; }

/* ═══════════════════════════════════════
   FOOTER
═══════════════════════════════════════ */
footer {
  background: var(--gbg); padding: 40px 6.25vw 60px;
  border-top: 1px solid var(--gb);
  display: flex; justify-content: space-between;
  font: 400 12px/1.5 var(--ff); color: var(--gt);
}
footer a { color: var(--gt); text-decoration: none; transition: color var(--tr); }
footer a:hover { color: var(--cyan); }

/* ═══════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════ */
@media (max-width: 1080px) {
  .work-rail { width: 180px; }
  .project-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 760px) {
  .page-body { flex-direction: column; }
  .work-rail {
    width: 100%; height: auto; position: static;
    border-right: none; border-bottom: 1px solid var(--gb);
    flex-direction: row; overflow-x: auto;
    padding: 0; gap: 0;
  }
  .rail-label { display: none; }
  .work-entry {
    flex-shrink: 0; padding: 12px 16px;
    border-bottom: none; border-right: 1px solid var(--gb);
    border-left: none; border-top: 2px solid transparent;
  }
  .work-entry.active { border-top-color: var(--magenta); border-left: none; }
  .work-role, .work-period { display: none; }
  .work-org { font-size: 12px; white-space: nowrap; }
  .project-grid { grid-template-columns: repeat(2, 1fr); }
  .site-header { padding: 0 20px; gap: 12px; }
  .filter-chips { display: none; }
  .site-hero { height: 55vw; min-height: 320px; }
}
@media (max-width: 480px) {
  .project-grid { grid-template-columns: 1fr; }
  .detail-panel { width: 100vw; }
  footer { flex-direction: column; gap: 8px; padding: 32px 20px 48px; }
}
</style>
</head>
<body>

<!-- STICKY HEADER (overlays hero, goes solid on scroll) -->
<header class="site-header" id="site-header">
  <div class="site-wordmark">

<!-- FULL-BLEED HERO -->
<section class="site-hero" id="site-hero">

</section>

<!-- PAGE BODY -->
<div class="page-body">

  <!-- LEFT RAIL: Work Experience -->

    <div class="rail-label">Experience</div>
  </aside>

  <!-- GRID -->
  <main class="project-area">
    <div class="project-grid" id="project-grid"></div>
  </main>

</div>

<footer>
  <span>© Raghav Kohli 2026</span>
  <span>
    <a href="mailto:raghav.kohli.work@gmail.com">raghav.kohli.work@gmail.com</a>
    &nbsp;·&nbsp;
    <a href="https://linkedin.com/in/raghavkohli31" target="_blank">LinkedIn</a>
  </span>
</footer>

<!-- DETAIL OVERLAY -->
<div class="detail-overlay" id="detail-overlay">
  <div class="detail-panel" id="detail-panel">
    <div class="detail-header">
      <div>
        <div class="detail-org" id="detail-org"></div>
        <div class="detail-title" id="detail-title"></div>
      </div>
      <button class="detail-close" id="detail-close">Close ✕</button>
    </div>
    <div class="detail-body" id="detail-body"></div>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <div class="lb-top">
    <span class="lb-label" id="lb-label"></span>
    <button class="lb-close" id="lb-close">Close ✕</button>
  </div>
  <div class="lb-main">
    <button class="lb-arrow lb-prev" id="lb-prev">‹</button>
    <img id="lb-img" src="" alt="">
    <button class="lb-arrow lb-next" id="lb-next">›</button>
  </div>
  <div class="lb-counter" id="lb-counter"></div>
  <div class="lb-strip" id="lb-strip"></div>
</div>

<script src="content.js"></script>
<script>

// ═══════════════════════════════════════
// HERO
// ═══════════════════════════════════════
const HERO_IMAGES = [
  'images/CEPT/Eco-machine/render-01.jpg',
  'images/CEPT/Water Urbanism/masterplan.jpg',
  'images/CEPT/Living Heritage/axo.jpg',
  'images/CEPT/Generative Techniques/typology diag.jpg',
  'images/CEPT/Eco-machine/render-02.jpg',
];

(function initHero() {
  const container = document.getElementById('hero-slides');
  const dotsEl    = document.getElementById('hero-dots');
  const slides    = [];
  const dots      = [];
  let current     = 0;

  HERO_IMAGES.forEach((src, i) => {
    // Slide
    const div = document.createElement('div');
    div.className = 'hero-slide' + (i === 0 ? ' active' : '');
    div.style.backgroundImage = `url(${src})`;
    container.appendChild(div);
    slides.push(div);

    // Dot
    const btn = document.createElement('button');
    btn.className = 'hero-dot' + (i === 0 ? ' active' : '');
    btn.addEventListener('click', () => goTo(i));
    dotsEl.appendChild(btn);
    dots.push(btn);
  });

  function goTo(n) {
    slides[current].classList.remove('active');
    dots[current].classList.remove('active');
    current = (n + slides.length) % slides.length;
    slides[current].classList.add('active');
    dots[current].classList.add('active');
  }

  // Auto-cycle every 6s
  let timer = setInterval(() => goTo(current + 1), 6000);
  // Pause on hover
  const hero = document.getElementById('site-hero');
  hero.addEventListener('mouseenter', () => clearInterval(timer));
  hero.addEventListener('mouseleave', () => { timer = setInterval(() => goTo(current + 1), 6000); });
})();

// ═══════════════════════════════════════
// HEADER: transparent → solid on scroll
// ═══════════════════════════════════════
(function initHeader() {
  const header = document.getElementById('site-header');
  const hero   = document.getElementById('site-hero');

  function sync() {
    const bottom = hero.getBoundingClientRect().bottom;
    header.classList.toggle('scrolled', bottom <= 80);
  }
  window.addEventListener('scroll', sync, { passive: true });
  sync();
})();

// ═══════════════════════════════════════
// WORK EXPERIENCE RAIL
// ═══════════════════════════════════════
const WORK = [
  {
    id: 'perspectives',
    org: 'Perspectives',
    role: 'Founder',
    period: '2025',
    cards: ['perspectives'],
  },
  {
    id: 'iclei',
    org: 'ICLEI South Asia',
    role: 'Project Officer · Climate & Energy',
    period: '2023 – 24',
    cards: ['capacities', 'malaysia', 'loss-damage', 'urban95', 'clean-energy'],
  },
  {
    id: 'niua',
    org: 'NIUA / MoHUA',
    role: 'Climate Fellow · C3',
    period: '2022 – 23',
    cards: ['state-of-cities', 'compendium', 'nbs-toolkit'],
  },
  {
    id: 'cept',
    org: 'CEPT University',
    role: 'Bachelors in Urban Design',
    period: '2017 – 22',
    cards: ['living-heritage', 'utopias-heterotopias', 'eco-machine', 'generative-techniques', 'water-urbanism', 'open-source-urbanism'],
  },
  {
    id: 'ccb',
    org: "CCB's Office",
    role: 'Urban Design Intern',
    period: '2021',
    cards: [],
  },
];

let activeOrg = null;
const rail = document.getElementById('work-rail');

WORK.forEach(exp => {
  const el = document.createElement('div');
  el.className = 'work-entry';
  el.dataset.id = exp.id;
  el.innerHTML = `
    <div class="work-org">${exp.org}</div>
    <div class="work-role">${exp.role}</div>
    <div class="work-period">${exp.period}</div>
  `;
  el.addEventListener('click', () => {
    if (activeOrg === exp.id) {
      // Click again to deselect
      activeOrg = null;
      rail.querySelectorAll('.work-entry').forEach(e => e.classList.remove('active'));
    } else {
      activeOrg = exp.id;
      rail.querySelectorAll('.work-entry').forEach(e => e.classList.remove('active'));
      el.classList.add('active');
    }
    applyFilters();
  });
  rail.appendChild(el);
});

// ═══════════════════════════════════════
// TAGS
// ═══════════════════════════════════════
const TAGS = {
  'malaysia':              ['climate', 'green city', 'Southeast Asia', 'policy'],
  'capacities':            ['climate', 'capacity building', 'South Asia', 'cities'],
  'loss-damage':           ['climate', 'policy', 'multilateral', 'COP'],
  'urban95':               ['urban design', 'child-friendly', 'India', 'Udaipur'],
  'clean-energy':          ['clean energy', 'policy', 'cities', 'South Asia'],
  'state-of-cities':       ['climate policy', 'research', 'India', 'MoHUA'],
  'compendium':            ['climate', 'urban', 'India', 'best practices'],
  'nbs-toolkit':           ['nature-based solutions', 'urban green', 'India', 'toolkit'],
  'perspectives':          ['community', 'conversations', 'civic', 'Bengaluru'],
  'living-heritage':       ['urban design', 'heritage', 'participatory', 'Ahmedabad'],
  'utopias-heterotopias':  ['housing', 'urban design', 'informal settlements', 'India'],
  'eco-machine':           ['landscape', 'ecology', 'Mumbai', 'BKC'],
  'generative-techniques': ['computational design', 'algorithms', 'urban form', 'Ahmedabad'],
  'water-urbanism':        ['landscape urbanism', 'water', 'Mumbai', 'Mithi River'],
  'open-source-urbanism':  ['research', 'participatory', 'Mumbai', 'fishing village'],
};

// Reverse lookup: card id → work experience id
const CARD_TO_WORK = {};
WORK.forEach(exp => exp.cards.forEach(cid => (CARD_TO_WORK[cid] = exp.id)));

// ═══════════════════════════════════════
// BUILD CARD LIST
// ═══════════════════════════════════════
const cards = [];
CONTENT.projects.forEach(project => {
  if (!project.featured) return;
  if (project.id === 'perspectives') {
    cards.push({ project, subproject: null, id: 'perspectives' });
    return;
  }
  if (project.subprojects && project.subprojects.length > 0) {
    project.subprojects.forEach(sp => {
      if (sp.group) return;
      cards.push({ project, subproject: sp, id: sp.id });
    });
  } else {
    cards.push({ project, subproject: null, id: project.id });
  }
});

// ═══════════════════════════════════════
// CATEGORY CHIPS
// ═══════════════════════════════════════
const CATEGORIES = ['All', 'Climate', 'Design', 'Community'];

function categoryOf(card) {
  const c = card.project.category || '';
  if (c === 'climate')   return 'Climate';
  if (c === 'design')    return 'Design';
  if (c === 'community') return 'Community';
  return 'Research';
}

let activeCategory = 'All';
const chipsEl = document.getElementById('filter-chips');
CATEGORIES.forEach(cat => {
  const btn = document.createElement('button');
  btn.className = 'chip' + (cat === 'All' ? ' active' : '');
  btn.textContent = cat;
  btn.addEventListener('click', () => {
    activeCategory = cat;
    chipsEl.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    applyFilters();
  });
  chipsEl.appendChild(btn);
});

// ═══════════════════════════════════════
// RENDER CARDS
// ═══════════════════════════════════════
const grid = document.getElementById('project-grid');

cards.forEach((card, idx) => {
  const tags   = TAGS[card.id] || [];
  const title  = card.subproject?.title || card.project.title;
  const desc   = card.subproject?.description || card.project.description || '';
  const year   = card.project.year || '';
  const org    = (card.project.title !== title) ? card.project.title : '';
  const meta   = [org || categoryOf(card), year].filter(Boolean).join(' · ');
  const images = (card.subproject?.images || []).filter(Boolean);
  const thumb  = images[0] || null;

  const el = document.createElement('div');
  el.className = 'module';
  el.dataset.idx      = idx;
  el.dataset.category = categoryOf(card);
  el.dataset.cardid   = card.id;
  el.dataset.search   = [title, desc, ...tags, org, year].join(' ').toLowerCase();

  el.innerHTML = `
    <div class="module-head${thumb ? '' : ' module-head-empty'}">
      <div class="module-head-inner">
        ${thumb ? `<img src="${thumb}" alt="${title}" loading="lazy" decoding="async">` : ''}
      </div>
    </div>
    <div class="module-body">
      <div class="module-eyebrow">${categoryOf(card)}</div>
      <div class="module-title">${title}</div>
      <div class="module-excerpt">${desc}</div>
      <div class="module-meta">${meta}</div>
      <div class="module-tags">${tags.map(t => `<span class="module-tag">${t}</span>`).join('')}</div>
    </div>
  `;

  el.addEventListener('click', () => openDetail(card, idx));
  grid.appendChild(el);
});

// ═══════════════════════════════════════
// FILTERS
// ═══════════════════════════════════════
function applyFilters() {
  const query = document.getElementById('search-input').value.trim().toLowerCase();
  let visible = 0;

  grid.querySelectorAll('.module').forEach(el => {
    const matchCat  = activeCategory === 'All' || el.dataset.category === activeCategory;
    const matchOrg  = !activeOrg || CARD_TO_WORK[el.dataset.cardid] === activeOrg;
    const matchQ    = !query || el.dataset.search.includes(query);
    const show      = matchCat && matchOrg && matchQ;
    el.classList.toggle('hidden', !show);
    if (show) visible++;
  });

  document.getElementById('header-count').textContent = `${visible} project${visible !== 1 ? 's' : ''}`;

  const old = grid.querySelector('.grid-empty');
  if (old) old.remove();
  if (visible === 0) {
    const empty = document.createElement('div');
    empty.className = 'grid-empty';
    empty.textContent = 'No projects match.';
    grid.appendChild(empty);
  }
}

document.getElementById('search-input').addEventListener('input', applyFilters);
applyFilters();

// ═══════════════════════════════════════
// LIGHTBOX
// ═══════════════════════════════════════
const lb = document.getElementById('lightbox');
let lbImages = [], lbIndex = 0;

function openLightbox(images, index, title) {
  lbImages = images; lbIndex = index;
  document.getElementById('lb-label').textContent = title;
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
  renderLb();
}
function renderLb() {
  document.getElementById('lb-img').src = lbImages[lbIndex];
  document.getElementById('lb-counter').textContent = `${lbIndex + 1} / ${lbImages.length}`;
  const strip = document.getElementById('lb-strip');
  strip.innerHTML = lbImages.map((s, i) =>
    `<img class="lb-thumb ${i === lbIndex ? 'active' : ''}" src="${s}" data-i="${i}">`
  ).join('');
  strip.querySelectorAll('.lb-thumb').forEach(t =>
    t.addEventListener('click', () => { lbIndex = +t.dataset.i; renderLb(); })
  );
  strip.querySelector('.lb-thumb.active')?.scrollIntoView({ inline: 'center', behavior: 'smooth' });
}
document.getElementById('lb-close').addEventListener('click', () => { lb.classList.remove('open'); document.body.style.overflow = ''; });
document.getElementById('lb-prev').addEventListener('click',  () => { lbIndex = (lbIndex - 1 + lbImages.length) % lbImages.length; renderLb(); });
document.getElementById('lb-next').addEventListener('click',  () => { lbIndex = (lbIndex + 1) % lbImages.length; renderLb(); });
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'ArrowLeft')  { lbIndex = (lbIndex - 1 + lbImages.length) % lbImages.length; renderLb(); }
  if (e.key === 'ArrowRight') { lbIndex = (lbIndex + 1) % lbImages.length; renderLb(); }
  if (e.key === 'Escape') { lb.classList.remove('open'); document.body.style.overflow = ''; }
});

// ═══════════════════════════════════════
// DETAIL PANEL
// ═══════════════════════════════════════
const overlay    = document.getElementById('detail-overlay');
const detailBody = document.getElementById('detail-body');
let currentCard  = null;

function openDetail(card, idx) {
  currentCard = { card, idx };
  const title    = card.subproject?.title || card.project.title;
  const desc     = card.subproject?.description || card.project.description || '';
  const org      = (card.project.title !== title) ? card.project.title : (card.project.role || '');
  const tags     = TAGS[card.id] || [];
  const images   = (card.subproject?.images || []).filter(Boolean);
  const isReader = card.subproject?.viewer === 'reader';
  const children = card.subproject
    ? (card.project.subprojects || []).filter(sp => sp.group === card.subproject.id)
    : [];

  grid.querySelectorAll('.module').forEach(c => c.classList.remove('active'));
  grid.querySelectorAll('.module')[idx]?.classList.add('active');

  document.getElementById('detail-org').textContent   = org;
  document.getElementById('detail-title').textContent = title;

  if (isReader && images.length > 0) {
    detailBody.innerHTML = buildReader(images, title);
    initReader(detailBody, images, title);
  } else if (card.project.id === 'perspectives') {
    buildPerspectivesDetail(card.project, desc, tags);
  } else {
    buildStandardDetail(title, desc, tags, images, children, card.project);
  }

  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function buildStandardDetail(title, desc, tags, images, children, project) {
  let html = `<div class="detail-desc">${desc}</div>`;
  if (tags.length)
    html += `<div class="detail-tags">${tags.map(t => `<span class="detail-tag">${t}</span>`).join('')}</div>`;
  if (children.length) {
    html += `<div class="detail-subprojects">
      <div class="detail-sub-label">${children.length} related plan${children.length > 1 ? 's' : ''}</div>
      ${children.map(c => `
        <div class="sub-row" data-child-id="${c.id}">
          <span class="sub-row-title">${c.title}</span>
          <div class="sub-row-meta">
            <span class="sub-row-count">${(c.images||[]).filter(Boolean).length} pages</span>
            <span class="sub-row-arr">→</span>
          </div>
        </div>`).join('')}
    </div>`;
  }
  if (images.length) {
    html += `<div class="detail-images">
      <div class="detail-images-label">${images.length} images</div>
      <div class="img-grid">
        ${images.map((src, i) => `<div class="img-thumb" data-i="${i}"><img src="${src}" alt="" loading="lazy" decoding="async"></div>`).join('')}
      </div>
    </div>`;
  }
  detailBody.innerHTML = html;
  detailBody.querySelectorAll('.img-thumb').forEach(t =>
    t.addEventListener('click', () => openLightbox(images, +t.dataset.i, title))
  );
  detailBody.querySelectorAll('.sub-row').forEach(row => {
    row.addEventListener('click', () => {
      const child = project.subprojects.find(sp => sp.id === row.dataset.childId);
      if (!child) return;
      const ci = (child.images || []).filter(Boolean);
      document.getElementById('detail-title').textContent = child.title;
      detailBody.innerHTML = buildReader(ci, child.title);
      initReader(detailBody, ci, child.title);
    });
  });
}

function buildPerspectivesDetail(project, desc, tags) {
  const convs  = project.conversations || [];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const fmt = d => { if (!d) return ''; const [y,m] = d.split('-'); return `${months[+m-1]} ${y}`; };
  const statsHTML = (project.stats||[]).map(s => `
    <div class="persp-stat"><div class="persp-stat-n">${s.number}</div><div class="persp-stat-l">${s.label}</div></div>`).join('');
  const convsHTML = convs.map(c => `
    <div class="conv-row">
      <span class="conv-format">${c.format}</span>
      <div class="conv-info"><div class="conv-name">${c.title}</div><div class="conv-desc-s">${c.description}</div></div>
      <span class="conv-date">${fmt(c.date)}</span>
    </div>`).join('');
  detailBody.innerHTML = `
    <div class="detail-desc">${desc}</div>
    ${tags.length ? `<div class="detail-tags">${tags.map(t=>`<span class="detail-tag">${t}</span>`).join('')}</div>` : ''}
    <div class="persp-stats">${statsHTML}</div>
    <div class="persp-convs"><div class="persp-convs-label">${convs.length} conversations</div>${convsHTML}</div>`;
}

// ═══════════════════════════════════════
// READER
// ═══════════════════════════════════════
function buildReader(images, title) {
  return `<div class="reader-wrap">
    <div class="reader-stage">
      <button class="reader-nav reader-prev">‹</button>
      <img class="reader-img" src="${images[0]||''}" alt="${title}">
      <button class="reader-nav reader-next">›</button>
    </div>
    <div class="reader-bar">
      <button class="reader-back">← Back</button>
      <span class="reader-count">1 / ${images.length}</span>
    </div>
    <div class="reader-strip">
      ${images.map((s,i)=>`<div class="reader-thumb${i===0?' active':''}"><img src="${s}" loading="lazy" decoding="async"></div>`).join('')}
    </div>
  </div>`;
}

function initReader(container, images, title) {
  let idx = 0;
  const imgEl   = container.querySelector('.reader-img');
  const countEl = container.querySelector('.reader-count');
  const strip   = container.querySelector('.reader-strip');
  function goTo(n) {
    idx = (n + images.length) % images.length;
    imgEl.src = images[idx];
    countEl.textContent = `${idx+1} / ${images.length}`;
    strip.querySelectorAll('.reader-thumb').forEach((t,i) => t.classList.toggle('active', i===idx));
    strip.querySelectorAll('.reader-thumb')[idx]?.scrollIntoView({ inline:'center', behavior:'smooth' });
  }
  container.querySelector('.reader-prev').addEventListener('click', () => goTo(idx-1));
  container.querySelector('.reader-next').addEventListener('click', () => goTo(idx+1));
  container.querySelector('.reader-stage').addEventListener('click', e => {
    if (e.target.closest('.reader-nav')) return;
    openLightbox(images, idx, title);
  });
  container.querySelectorAll('.reader-thumb').forEach((t,i) => t.addEventListener('click', () => goTo(i)));
  const back = container.querySelector('.reader-back');
  if (back && currentCard) back.addEventListener('click', () => openDetail(currentCard.card, currentCard.idx));
  function rKey(e) {
    if (!overlay.classList.contains('open') || lb.classList.contains('open')) return;
    if (e.key === 'ArrowLeft')  goTo(idx-1);
    if (e.key === 'ArrowRight') goTo(idx+1);
  }
  document.addEventListener('keydown', rKey);
}

// ═══════════════════════════════════════
// CLOSE
// ═══════════════════════════════════════
function closeDetail() {
  overlay.classList.remove('open');
  document.body.style.overflow = '';
  grid.querySelectorAll('.module').forEach(c => c.classList.remove('active'));
}
document.getElementById('detail-close').addEventListener('click', closeDetail);
overlay.addEventListener('click', e => { if (e.target === overlay) closeDetail(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && overlay.classList.contains('open') && !lb.classList.contains('open')) closeDetail();
});

</script>
</body>
</html>
