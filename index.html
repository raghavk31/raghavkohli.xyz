<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raghav Kohli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

:root {
  --white: #FFFFFF;
  --black: #0D0D0D;
  --mid:   #666666;
  --dim:   #AAAAAA;
  --rule:  #E8E8E8;
  --bg:    #F7F7F7;
  --red:   #B03A1C;
  --teal:  #3E7D8C;
  --fd: 'Syne', sans-serif;
  --fb: 'DM Sans', Helvetica, sans-serif;
  --fm: 'DM Mono', monospace;
}

body {
  background: var(--white);
  color: var(--black);
  font-family: var(--fb);
  -webkit-font-smoothing: antialiased;
}

/* ─── HEADER ─── */
.site-header {
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: end;
  padding: 48px 52px 36px;
  border-bottom: 1px solid var(--rule);
  gap: 40px;
}
.site-name {
  font-family: var(--fd);
  font-size: clamp(52px, 7vw, 96px);
  font-weight: 800;
  line-height: 0.88;
  letter-spacing: -3px;
  color: var(--black);
  text-transform: uppercase;
}
.site-name .ln { display: block; }
.site-tagline {
  font-family: var(--fm);
  font-size: 9px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--dim);
  margin-top: 16px;
}
.header-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 10px;
}
.search-wrap {
  position: relative;
  width: 100%;
  max-width: 380px;
}
.search-input {
  width: 100%;
  border: 0;
  border-bottom: 1px solid var(--rule);
  padding: 10px 36px 10px 0;
  font-family: var(--fm);
  font-size: 11px;
  letter-spacing: 0.5px;
  color: var(--black);
  background: none;
  outline: none;
  transition: border-color 0.2s;
}
.search-input:focus { border-bottom-color: var(--black); }
.search-input::placeholder { color: var(--dim); }
.search-icon {
  position: absolute;
  right: 0; top: 50%;
  transform: translateY(-50%);
  color: var(--dim);
  font-size: 14px;
  pointer-events: none;
}
.filter-chips {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.chip {
  font-family: var(--fm);
  font-size: 8px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 5px 12px;
  border: 1px solid var(--rule);
  color: var(--mid);
  cursor: pointer;
  transition: all 0.15s;
  background: none;
}
.chip:hover { border-color: var(--black); color: var(--black); }
.chip.active { background: var(--black); color: var(--white); border-color: var(--black); }
.header-count {
  font-family: var(--fm);
  font-size: 8.5px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--dim);
}

/* ─── GRID ─── */
.project-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--rule);
}

/* ─── CARD ─── */
.card {
  background: var(--white);
  padding: 0 0 24px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  transition: background 0.15s;
  position: relative;
}
.card:hover { background: var(--bg); }
.card.active { background: var(--bg); }
.card.active .card-title { color: var(--red); }
.card.hidden { display: none; }

.card-thumb {
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  background: #EBEBEB;
  flex-shrink: 0;
  margin-bottom: 20px;
}
.card-thumb img {
  width: 100%; height: 100%;
  object-fit: cover;
  transition: transform 0.45s ease;
  display: block;
}
.card:hover .card-thumb img { transform: scale(1.04); }
.card-no-thumb {
  padding-top: 24px;
}
.card-inner { padding: 0 24px; display: flex; flex-direction: column; flex: 1; }

.card-meta {
  font-family: var(--fm);
  font-size: 8px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--dim);
  margin-bottom: 9px;
}
.card-title {
  font-family: var(--fd);
  font-size: 18px;
  font-weight: 700;
  line-height: 1.15;
  color: var(--black);
  margin-bottom: 10px;
  transition: color 0.2s;
}
.card-desc {
  font-size: 12px;
  font-weight: 300;
  line-height: 1.8;
  color: var(--mid);
  flex: 1;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px solid var(--rule);
}
.card-tag {
  font-family: var(--fm);
  font-size: 8px;
  letter-spacing: 0.3px;
  color: var(--teal);
}
.card-tag::before { content: '#'; }

/* ─── GRID EMPTY ─── */
.grid-empty {
  grid-column: 1 / -1;
  padding: 80px 52px;
  font-family: var(--fm);
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--dim);
  text-align: center;
  background: var(--white);
}

/* ─── DETAIL OVERLAY + PANEL ─── */
.detail-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(13,13,13,0.35);
}
.detail-overlay.open { display: block; }

.detail-panel {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: min(820px, 90vw);
  background: var(--white);
  z-index: 101;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transform: translateX(100%);
  transition: transform 0.38s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: -12px 0 60px rgba(0,0,0,0.08);
}
.detail-overlay.open .detail-panel { transform: translateX(0); }

.detail-header {
  padding: 28px 32px 22px;
  border-bottom: 1px solid var(--rule);
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-shrink: 0;
  gap: 20px;
}
.detail-org {
  font-family: var(--fm);
  font-size: 8px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--dim);
  margin-bottom: 7px;
}
.detail-title {
  font-family: var(--fd);
  font-size: 26px;
  font-weight: 700;
  line-height: 1.1;
  color: var(--black);
}
.detail-close {
  font-family: var(--fm);
  font-size: 8.5px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--dim);
  background: none;
  border: none;
  cursor: pointer;
  flex-shrink: 0;
  padding-top: 4px;
  transition: color 0.2s;
}
.detail-close:hover { color: var(--black); }

.detail-body { flex: 1; overflow-y: auto; }
.detail-desc {
  padding: 24px 32px;
  font-size: 13.5px;
  font-weight: 300;
  line-height: 1.95;
  color: var(--mid);
  border-bottom: 1px solid var(--rule);
}
.detail-tags {
  padding: 14px 32px;
  display: flex; flex-wrap: wrap; gap: 8px;
  border-bottom: 1px solid var(--rule);
}
.detail-tag {
  font-family: var(--fm);
  font-size: 9px;
  letter-spacing: 0.3px;
  color: var(--teal);
}
.detail-tag::before { content: '#'; }

/* Sub-project list inside detail */
.detail-subprojects { padding: 20px 32px; border-bottom: 1px solid var(--rule); }
.detail-sub-label {
  font-family: var(--fm); font-size: 8.5px; letter-spacing: 2px;
  text-transform: uppercase; color: var(--dim); margin-bottom: 12px;
}
.sub-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 0; border-bottom: 1px solid var(--rule);
  cursor: pointer;
}
.sub-row:last-child { border-bottom: none; }
.sub-row:hover .sub-row-title { color: var(--red); }
.sub-row-title { font-size: 13px; font-weight: 400; color: var(--black); transition: color 0.18s; }
.sub-row-meta { display: flex; gap: 8px; align-items: center; }
.sub-row-count { font-family: var(--fm); font-size: 8px; letter-spacing: 1px; color: var(--dim); }
.sub-row-arr { color: var(--dim); font-size: 12px; }

/* Image grid in detail */
.detail-images { padding: 24px 32px 32px; }
.detail-images-label {
  font-family: var(--fm); font-size: 8.5px; letter-spacing: 2px;
  text-transform: uppercase; color: var(--dim); margin-bottom: 14px;
}
.img-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.img-thumb { aspect-ratio: 4/3; overflow: hidden; cursor: pointer; background: var(--bg); }
.img-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.35s; display: block; }
.img-thumb:hover img { transform: scale(1.05); }

/* ─── READER ─── */
.reader-wrap { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.reader-stage {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 24px 52px; position: relative; background: var(--bg);
  cursor: zoom-in; min-height: 0; overflow: hidden;
}
.reader-img {
  max-width: 100%; max-height: 100%;
  object-fit: contain; display: block;
  box-shadow: 0 8px 40px rgba(0,0,0,0.09);
}
.reader-nav {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 16px; color: var(--mid);
  transition: all 0.18s; z-index: 2;
  font-family: var(--fb); line-height: 1;
  background: var(--white); border: 1px solid var(--rule);
}
.reader-nav:hover { border-color: var(--black); color: var(--black); }
.reader-prev { left: 8px; } .reader-next { right: 8px; }
.reader-bar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 14px; border-top: 1px solid var(--rule); flex-shrink: 0;
}
.reader-count { font-family: var(--fm); font-size: 8px; letter-spacing: 1.5px; color: var(--dim); }
.reader-back {
  font-family: var(--fm); font-size: 8px; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--mid);
  background: none; border: none; cursor: pointer; transition: color 0.18s;
}
.reader-back:hover { color: var(--black); }
.reader-strip {
  padding: 6px 10px; display: flex; gap: 3px;
  overflow-x: auto; border-top: 1px solid var(--rule); flex-shrink: 0;
}
.reader-strip::-webkit-scrollbar { height: 2px; }
.reader-strip::-webkit-scrollbar-thumb { background: var(--rule); }
.reader-thumb {
  flex-shrink: 0; width: 46px; height: 32px; overflow: hidden;
  cursor: pointer; opacity: 0.3; transition: opacity 0.15s;
}
.reader-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.reader-thumb:hover { opacity: 0.65; }
.reader-thumb.active { opacity: 1; outline: 1.5px solid var(--teal); outline-offset: 1px; }

/* ─── PERSPECTIVES ─── */
.persp-stats { display: flex; border-bottom: 1px solid var(--rule); }
.persp-stat { flex: 1; padding: 24px 28px; border-right: 1px solid var(--rule); }
.persp-stat:last-child { border-right: none; }
.persp-stat-n { font-family: var(--fd); font-size: 40px; font-weight: 700; line-height: 1; color: var(--black); margin-bottom: 6px; }
.persp-stat-l { font-family: var(--fm); font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: var(--dim); }
.persp-convs { padding: 20px 32px 32px; }
.persp-convs-label { font-family: var(--fm); font-size: 8.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--dim); margin-bottom: 14px; }
.conv-row {
  display: flex; gap: 16px; align-items: baseline;
  padding: 13px 0; border-bottom: 1px solid var(--rule);
}
.conv-row:last-child { border-bottom: none; }
.conv-format { font-family: var(--fm); font-size: 8px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--red); flex-shrink: 0; min-width: 54px; }
.conv-info { flex: 1; }
.conv-name { font-size: 13px; font-weight: 400; color: var(--black); margin-bottom: 2px; }
.conv-desc-s { font-size: 11px; font-weight: 300; color: var(--dim); line-height: 1.6; }
.conv-date { font-family: var(--fm); font-size: 8px; color: var(--dim); white-space: nowrap; }

/* ─── LIGHTBOX ─── */
.lightbox { display: none; position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,0.97); flex-direction: column; }
.lightbox.open { display: flex; }
.lb-top { display: flex; justify-content: space-between; align-items: center; padding: 20px 36px; flex-shrink: 0; }
.lb-label { font-family: var(--fm); font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.3); }
.lb-close { font-family: var(--fm); font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.35); background: none; border: none; cursor: pointer; transition: color 0.2s; }
.lb-close:hover { color: #fff; }
.lb-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 64px; position: relative; min-height: 0; }
.lb-main img { max-height: 100%; max-width: 100%; object-fit: contain; }
.lb-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: none; border: none; color: rgba(255,255,255,0.3); font-size: 36px; cursor: pointer; padding: 16px; transition: color 0.2s; line-height: 1; }
.lb-arrow:hover { color: #fff; }
.lb-prev { left: 0; } .lb-next { right: 0; }
.lb-counter { font-family: var(--fm); font-size: 9px; letter-spacing: 1.5px; color: rgba(255,255,255,0.2); text-align: center; padding: 8px; flex-shrink: 0; }
.lb-strip { padding: 6px 36px 20px; display: flex; gap: 5px; overflow-x: auto; justify-content: center; flex-shrink: 0; }
.lb-strip::-webkit-scrollbar { height: 2px; }
.lb-strip::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); }
.lb-thumb { width: 52px; height: 38px; object-fit: cover; cursor: pointer; opacity: 0.28; transition: opacity 0.2s; flex-shrink: 0; }
.lb-thumb.active { opacity: 1; outline: 1px solid rgba(255,255,255,0.5); }
.lb-thumb:hover { opacity: 0.65; }

/* ─── FOOTER ─── */
footer {
  padding: 22px 52px;
  border-top: 1px solid var(--rule);
  display: flex; justify-content: space-between;
  font-family: var(--fm); font-size: 9px; letter-spacing: 1px; color: var(--dim);
}
footer a { color: var(--dim); text-decoration: none; transition: color 0.2s; }
footer a:hover { color: var(--black); }

/* ─── RESPONSIVE ─── */
@media (max-width: 960px) {
  .project-grid { grid-template-columns: repeat(2, 1fr); }
  .site-header { grid-template-columns: 1fr; gap: 24px; }
  .header-right { align-items: flex-start; }
  .filter-chips { justify-content: flex-start; }
}
@media (max-width: 600px) {
  .project-grid { grid-template-columns: 1fr; }
  .site-header { padding: 32px 24px 24px; }
  .detail-panel { width: 100vw; }
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="site-header">
  <div>
    <div class="site-name">
      <span class="ln">RAGHAV</span>
      <span class="ln">KOHLI</span>
    </div>
    <div class="site-tagline">Urban Designer · Climate Strategist · Bengaluru, India</div>
  </div>
  <div class="header-right">
    <div class="search-wrap">
      <input type="text" class="search-input" id="search-input" placeholder="Search projects, skills, places…">
      <span class="search-icon">⌕</span>
    </div>
    <div class="filter-chips" id="filter-chips"></div>
    <div class="header-count" id="header-count"></div>
  </div>
</header>

<!-- GRID -->
<main>
  <div class="project-grid" id="project-grid"></div>
</main>

<footer>
  <span>© Raghav Kohli 2026</span>
  <span><a href="mailto:raghav.kohli.work@gmail.com">raghav.kohli.work@gmail.com</a> &nbsp;·&nbsp; <a href="https://linkedin.com/in/raghavkohli31" target="_blank">LinkedIn</a></span>
</footer>

<!-- DETAIL OVERLAY -->
<div class="detail-overlay" id="detail-overlay">
  <div class="detail-panel" id="detail-panel">
    <div class="detail-header">
      <div>
        <div class="detail-org" id="detail-org"></div>
        <div class="detail-title" id="detail-title"></div>
      </div>
      <button class="detail-close" id="detail-close">Close ✕</button>
    </div>
    <div class="detail-body" id="detail-body"></div>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <div class="lb-top">
    <span class="lb-label" id="lb-label"></span>
    <button class="lb-close" id="lb-close">Close ✕</button>
  </div>
  <div class="lb-main">
    <button class="lb-arrow lb-prev" id="lb-prev">‹</button>
    <img id="lb-img" src="" alt="">
    <button class="lb-arrow lb-next" id="lb-next">›</button>
  </div>
  <div class="lb-counter" id="lb-counter"></div>
  <div class="lb-strip" id="lb-strip"></div>
</div>

<script src="content.js"></script>
<script>

// ─── TAGS ──────────────────────────────────────────────────
const TAGS = {
  'malaysia':              ['climate', 'green city', 'Southeast Asia', 'policy'],
  'capacities':            ['climate', 'capacity building', 'South Asia', 'cities'],
  'vadodara-crcap':        ['climate resilience', 'action plan', 'India', 'Vadodara'],
  'ahmedabad-crcap':       ['climate resilience', 'action plan', 'India', 'Ahmedabad'],
  'surat-crcap':           ['climate resilience', 'action plan', 'India', 'Surat'],
  'loss-damage':           ['climate', 'policy', 'multilateral', 'COP'],
  'urban95':               ['urban design', 'child-friendly', 'India', 'Udaipur'],
  'clean-energy':          ['clean energy', 'policy', 'cities', 'South Asia'],
  'perspectives':          ['community', 'conversations', 'civic', 'Bengaluru'],
  'living-heritage':       ['urban design', 'heritage', 'participatory', 'Ahmedabad'],
  'utopias-heterotopias':  ['housing', 'urban design', 'informal settlements', 'India'],
  'eco-machine':           ['landscape', 'ecology', 'Mumbai', 'BKC'],
  'generative-techniques': ['computational design', 'algorithms', 'urban form', 'Ahmedabad'],
  'water-urbanism':        ['landscape urbanism', 'water', 'Mumbai', 'Mithi River'],
  'open-source-urbanism':  ['research', 'participatory', 'Mumbai', 'fishing village'],
};

// ─── BUILD CARD LIST ───────────────────────────────────────
const cards = [];

CONTENT.projects.forEach(project => {
  if (!project.featured) return;

  if (project.id === 'perspectives') {
    cards.push({ project, subproject: null, id: 'perspectives' });
    return;
  }

  if (project.subprojects && project.subprojects.length > 0) {
    project.subprojects.forEach(sp => {
      if (sp.group) return; // children rendered under their parent
      cards.push({ project, subproject: sp, id: sp.id });
    });
  } else {
    cards.push({ project, subproject: null, id: project.id });
  }
});

// ─── FILTER CATEGORIES ────────────────────────────────────
const CATEGORIES = ['All', 'Climate', 'Design', 'Community'];

function categoryOf(card) {
  const c = card.project.category || '';
  if (c === 'climate') return 'Climate';
  if (c === 'design')  return 'Design';
  if (c === 'community') return 'Community';
  return 'Other';
}

// ─── RENDER CHIPS ─────────────────────────────────────────
let activeCategory = 'All';
const chipsEl = document.getElementById('filter-chips');
CATEGORIES.forEach(cat => {
  const btn = document.createElement('button');
  btn.className = 'chip' + (cat === 'All' ? ' active' : '');
  btn.textContent = cat;
  btn.addEventListener('click', () => {
    activeCategory = cat;
    chipsEl.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    applyFilters();
  });
  chipsEl.appendChild(btn);
});

// ─── RENDER CARDS ─────────────────────────────────────────
const grid = document.getElementById('project-grid');

cards.forEach((card, idx) => {
  const tags   = TAGS[card.id] || [];
  const title  = card.subproject?.title || card.project.title;
  const desc   = card.subproject?.description || card.project.description || '';
  const year   = card.project.year;
  const org    = (card.project.title !== title) ? card.project.title : '';
  const meta   = [org || categoryOf(card), year].filter(Boolean).join(' · ');
  const images = (card.subproject?.images || []).filter(Boolean);
  const thumb  = images[0] || null;

  const el = document.createElement('div');
  el.className = 'card';
  el.dataset.idx = idx;
  el.dataset.category = categoryOf(card);
  el.dataset.search = [title, desc, ...tags, org, year].join(' ').toLowerCase();
  if (!thumb) el.classList.add('card-no-thumb');

  el.innerHTML = `
    ${thumb ? `<div class="card-thumb"><img src="${thumb}" alt="${title}" loading="lazy"></div>` : ''}
    <div class="card-inner">
      <div class="card-meta">${meta}</div>
      <div class="card-title">${title}</div>
      <div class="card-desc">${desc}</div>
      <div class="card-tags">${tags.map(t => `<span class="card-tag">${t}</span>`).join('')}</div>
    </div>
  `;

  el.addEventListener('click', () => openDetail(card, idx));
  grid.appendChild(el);
});

// ─── FILTERS ──────────────────────────────────────────────
function applyFilters() {
  const query = document.getElementById('search-input').value.trim().toLowerCase();
  let visible = 0;

  grid.querySelectorAll('.card').forEach((el, i) => {
    const matchCat = activeCategory === 'All' || el.dataset.category === activeCategory;
    const matchQ   = !query || el.dataset.search.includes(query);
    const show = matchCat && matchQ;
    el.classList.toggle('hidden', !show);
    if (show) visible++;
  });

  document.getElementById('header-count').textContent = `${visible} project${visible !== 1 ? 's' : ''}`;

  const existing = grid.querySelector('.grid-empty');
  if (existing) existing.remove();
  if (visible === 0) {
    const empty = document.createElement('div');
    empty.className = 'grid-empty';
    empty.textContent = 'No projects match your search.';
    grid.appendChild(empty);
  }
}

document.getElementById('search-input').addEventListener('input', applyFilters);
applyFilters();

// ─── LIGHTBOX ─────────────────────────────────────────────
const lb = document.getElementById('lightbox');
let lbImages = [], lbIndex = 0;

function openLightbox(images, index, title) {
  lbImages = images; lbIndex = index;
  document.getElementById('lb-label').textContent = title;
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
  renderLb();
}
function renderLb() {
  document.getElementById('lb-img').src = lbImages[lbIndex];
  document.getElementById('lb-counter').textContent = `${lbIndex + 1} / ${lbImages.length}`;
  const strip = document.getElementById('lb-strip');
  strip.innerHTML = lbImages.map((s, i) =>
    `<img class="lb-thumb ${i === lbIndex ? 'active' : ''}" src="${s}" data-i="${i}">`
  ).join('');
  strip.querySelectorAll('.lb-thumb').forEach(t =>
    t.addEventListener('click', () => { lbIndex = +t.dataset.i; renderLb(); })
  );
  strip.querySelector('.lb-thumb.active')?.scrollIntoView({ inline: 'center', behavior: 'smooth' });
}
document.getElementById('lb-close').addEventListener('click', () => { lb.classList.remove('open'); document.body.style.overflow = ''; });
document.getElementById('lb-prev').addEventListener('click', () => { lbIndex = (lbIndex - 1 + lbImages.length) % lbImages.length; renderLb(); });
document.getElementById('lb-next').addEventListener('click', () => { lbIndex = (lbIndex + 1) % lbImages.length; renderLb(); });
document.addEventListener('keydown', e => {
  if (lb.classList.contains('open')) {
    if (e.key === 'ArrowLeft')  { lbIndex = (lbIndex - 1 + lbImages.length) % lbImages.length; renderLb(); }
    if (e.key === 'ArrowRight') { lbIndex = (lbIndex + 1) % lbImages.length; renderLb(); }
    if (e.key === 'Escape') { lb.classList.remove('open'); document.body.style.overflow = ''; }
  }
});

// ─── DETAIL PANEL ─────────────────────────────────────────
const overlay   = document.getElementById('detail-overlay');
const detailBody = document.getElementById('detail-body');
let currentCard = null;

function openDetail(card, idx) {
  currentCard = { card, idx };
  const title  = card.subproject?.title || card.project.title;
  const desc   = card.subproject?.description || card.project.description || '';
  const org    = (card.project.title !== title) ? card.project.title : (card.project.role || '');
  const tags   = TAGS[card.id] || [];
  const images = (card.subproject?.images || []).filter(Boolean);
  const isReader = card.subproject?.viewer === 'reader';

  // children = CRCAP plans grouped under this subproject
  const children = card.subproject
    ? (card.project.subprojects || []).filter(sp => sp.group === card.subproject.id)
    : [];

  // Mark active card
  grid.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  grid.querySelectorAll('.card')[idx]?.classList.add('active');

  document.getElementById('detail-org').textContent   = org;
  document.getElementById('detail-title').textContent = title;

  if (isReader && images.length > 0) {
    detailBody.innerHTML = buildReader(images, title);
    initReader(detailBody, images, title);
  } else if (card.project.id === 'perspectives') {
    buildPerspectivesDetail(card.project, desc, tags);
  } else {
    buildStandardDetail(title, desc, tags, images, children, card.project);
  }

  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function buildStandardDetail(title, desc, tags, images, children, project) {
  let html = `<div class="detail-desc">${desc}</div>`;

  if (tags.length) {
    html += `<div class="detail-tags">${tags.map(t => `<span class="detail-tag">${t}</span>`).join('')}</div>`;
  }

  if (children.length) {
    html += `<div class="detail-subprojects">
      <div class="detail-sub-label">${children.length} related plan${children.length > 1 ? 's' : ''}</div>
      ${children.map(child => `
        <div class="sub-row" data-child-id="${child.id}">
          <span class="sub-row-title">${child.title}</span>
          <div class="sub-row-meta">
            <span class="sub-row-count">${(child.images||[]).filter(Boolean).length} pages</span>
            <span class="sub-row-arr">→</span>
          </div>
        </div>
      `).join('')}
    </div>`;
  }

  if (images.length) {
    html += `<div class="detail-images">
      <div class="detail-images-label">${images.length} images</div>
      <div class="img-grid">
        ${images.map((src, i) => `
          <div class="img-thumb" data-i="${i}">
            <img src="${src}" alt="" loading="lazy">
          </div>`).join('')}
      </div>
    </div>`;
  }

  detailBody.innerHTML = html;

  detailBody.querySelectorAll('.img-thumb').forEach(t =>
    t.addEventListener('click', () => openLightbox(images, +t.dataset.i, title))
  );

  detailBody.querySelectorAll('.sub-row').forEach(row => {
    row.addEventListener('click', () => {
      const child = project.subprojects.find(sp => sp.id === row.dataset.childId);
      if (!child) return;
      const childImgs = (child.images || []).filter(Boolean);
      document.getElementById('detail-title').textContent = child.title;
      detailBody.innerHTML = buildReader(childImgs, child.title);
      initReader(detailBody, childImgs, child.title);
    });
  });
}

function buildPerspectivesDetail(project, desc, tags) {
  const convs  = project.conversations || [];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const fmt = d => {
    if (!d) return '';
    const [y, m] = d.split('-');
    return `${months[+m - 1]} ${y}`;
  };

  const statsHTML = (project.stats || []).map(s => `
    <div class="persp-stat">
      <div class="persp-stat-n">${s.number}</div>
      <div class="persp-stat-l">${s.label}</div>
    </div>
  `).join('');

  const convsHTML = convs.map(c => `
    <div class="conv-row">
      <span class="conv-format">${c.format}</span>
      <div class="conv-info">
        <div class="conv-name">${c.title}</div>
        <div class="conv-desc-s">${c.description}</div>
      </div>
      <span class="conv-date">${fmt(c.date)}</span>
    </div>
  `).join('');

  detailBody.innerHTML = `
    <div class="detail-desc">${desc}</div>
    ${tags.length ? `<div class="detail-tags">${tags.map(t => `<span class="detail-tag">${t}</span>`).join('')}</div>` : ''}
    <div class="persp-stats">${statsHTML}</div>
    <div class="persp-convs">
      <div class="persp-convs-label">${convs.length} conversations</div>
      ${convsHTML}
    </div>
  `;
}

// ─── READER ───────────────────────────────────────────────
function buildReader(images, title) {
  return `
    <div class="reader-wrap">
      <div class="reader-stage">
        <button class="reader-nav reader-prev">‹</button>
        <img class="reader-img" src="${images[0] || ''}" alt="${title}">
        <button class="reader-nav reader-next">›</button>
      </div>
      <div class="reader-bar">
        <button class="reader-back">← Back</button>
        <span class="reader-count">1 / ${images.length}</span>
      </div>
      <div class="reader-strip">
        ${images.map((src, i) => `
          <div class="reader-thumb ${i === 0 ? 'active' : ''}">
            <img src="${src}" loading="lazy">
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function initReader(container, images, title) {
  let idx = 0;
  const imgEl   = container.querySelector('.reader-img');
  const countEl = container.querySelector('.reader-count');
  const strip   = container.querySelector('.reader-strip');

  function goTo(n) {
    idx = (n + images.length) % images.length;
    imgEl.src = images[idx];
    countEl.textContent = `${idx + 1} / ${images.length}`;
    strip.querySelectorAll('.reader-thumb').forEach((t, i) => t.classList.toggle('active', i === idx));
    strip.querySelectorAll('.reader-thumb')[idx]?.scrollIntoView({ inline: 'center', behavior: 'smooth' });
  }

  container.querySelector('.reader-prev').addEventListener('click', () => goTo(idx - 1));
  container.querySelector('.reader-next').addEventListener('click', () => goTo(idx + 1));
  container.querySelector('.reader-stage').addEventListener('click', e => {
    if (e.target.closest('.reader-nav')) return;
    openLightbox(images, idx, title);
  });
  container.querySelectorAll('.reader-thumb').forEach((t, i) =>
    t.addEventListener('click', () => goTo(i))
  );

  const backBtn = container.querySelector('.reader-back');
  if (backBtn && currentCard) {
    backBtn.addEventListener('click', () => {
      openDetail(currentCard.card, currentCard.idx);
    });
  }

  function readerKey(e) {
    if (!overlay.classList.contains('open') || lb.classList.contains('open')) return;
    if (e.key === 'ArrowLeft')  goTo(idx - 1);
    if (e.key === 'ArrowRight') goTo(idx + 1);
  }
  document.addEventListener('keydown', readerKey);
}

// ─── CLOSE DETAIL ─────────────────────────────────────────
function closeDetail() {
  overlay.classList.remove('open');
  document.body.style.overflow = '';
  grid.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
}
document.getElementById('detail-close').addEventListener('click', closeDetail);
overlay.addEventListener('click', e => { if (e.target === overlay) closeDetail(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && overlay.classList.contains('open') && !lb.classList.contains('open')) closeDetail();
});

</script>
