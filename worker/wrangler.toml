# The thoughts API: a Cloudflare Worker with a D1 database. Deploy from this folder:
#   npx wrangler login                       (once, opens the browser)
#   npx wrangler d1 create thoughts          (once; paste the database_id below)
#   npx wrangler d1 execute thoughts --remote --file=schema.sql
#   (a database older than migrations/ : run each file there in order, the same way)
#   npx wrangler secret put OWNER_KEY        (the word that marks Raghav's posts and allows delete)
#   npx wrangler secret put TURNSTILE_SECRET (from the Turnstile widget for raghavkohli.xyz; leave unset to skip the bot check)
#   npx wrangler secret put IP_SALT          (any long random string; IPs are only ever stored hashed with it)
#   npx wrangler deploy                      (prints the URL that goes in src/_data/site.js as thoughtsApi)
name = "thoughts"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "thoughts"
database_id = "51f01c72-3941-41a7-b7c5-8d71c64271c2"

[vars]
# origins allowed to call the API (the site, and the dev server)
ALLOWED_ORIGINS = "https://raghavkohli.xyz,https://www.raghavkohli.xyz,http://localhost:8087,http://localhost:8080"
MAX_BODY = "2000"      # visitors only; a post with the owner key has no length cap
MAX_NAME = "40"
MAX_TITLE = "80"
RATE_PER_HOUR = "3"
# the largest image the worker keeps, in bytes (D1 rows cap at 2 MB; the browser downscales first)
MAX_IMAGE = "1500000"
